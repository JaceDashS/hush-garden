[package]
name = "hush-garden"
version = "0.1.0"
description = "Hush Garden desktop app"
authors = ["Jung Soo Shin"]
license = "MIT"
repository = "https://github.com/JaceDashS/hush-garden"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
# Account requests go through the app instead of the web view, which keeps the session cookie in the app's own store.
tauri-plugin-http = "2"
